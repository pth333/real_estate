server:
  port: 8000
  # Cookie refresh_token có cờ Secure hay không.
  # Đang để false = giữ nguyên hành vi cũ. Khi FE/BE chạy HTTPS thật thì đổi thành true
  # (bật nhầm lúc còn HTTP thì browser sẽ KHÔNG lưu cookie ⇒ mất phiên đăng nhập).
  cookie_secure: true

mysql:
  host: mariadb
  port: 3306
  username: root
  password: 1111
  database: real_estate_db

kafka:
  # Trong docker network phải dùng listener INTERNAL (advertise là kafka:29092).
  # KHÔNG dùng kafka:9092: listener PLAINTEXT advertise 127.0.0.1:9092 (dành cho máy host),
  # nên khi broker trả metadata/controller endpoint, BE trong container sẽ dial 127.0.0.1 → refused.
  brokers:
    - kafka:29092
  client_id: real-estate-be
  group_prefix: real-estate-be
  topics:
    real_estate_crawled: real_estate.crawled.v1
    real_estate_enriched: real_estate.enriched.v1
    real_estate_notified: real_estate.notified.v1

redis:
  addr: redis:6379
  db: 0

recommendation:
  addr: recommendation:50051

payment:
  return_url: https://soihieuland.io.vn/payment/result
  ipn_url: https://soihieuland.io.vn/api/2026/deposits/payment/ipn
  vnpay:
    payment_url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    locale: vn
    expire_minutes: 15

deposit:
  # Phí môi giới dự phòng khi BĐS chưa có giá (bình thường tra bảng deposit_policies)
  default_broker_fee: 200000
  broker_confirm_hours: 24
  otp_valid_minutes: 10
  checkin_grace_hours: 2
  report_window_hours: 24
  # Số ngày GIỮ PHÍ sau buổi xem: khách đặt cọc mua BĐS trong khoảng này thì hoàn 100% phí,
  # quá hạn mà không đặt cọc thì phí thuộc về môi giới
  refund_window_days: 4
  dispute_evidence_hours: 48
  payment_timeout_minutes: 30
  cron_interval_seconds: 60

admin:
  email: ""