server:
  port: 8080
mysql:
  host: localhost
  port: 3308
  username: root
  password: 1111
  database: real_estate_db
kafka:
  brokers:
    - 127.0.0.1:9092
  client_id: real-estate-be
  group_prefix: real-estate-be
  topics:
    real_estate_crawled: real_estate.crawled.v1
    real_estate_enriched: real_estate.enriched.v1
    real_estate_notified: real_estate.notified.v1
redis:
  addr: localhost:6380
  db: 0
r2:
  region: auto
  bucket: real-estate-files
recommendation:
  addr: localhost:50051

# ── Luồng đặt cọc escrow ─────────────────────────────
payment:
  # FE nhận kết quả thanh toán (return URL)
  return_url: http://localhost:3000/payment/result
  # Backend nhận IPN từ cổng thanh toán
  ipn_url: http://localhost:8000/api/2026/deposits/payment/ipn
  vnpay:
    # Bỏ trống tmn_code/hash_secret → hệ thống tự dùng cổng MOCK để test luồng
    tmn_code: ""
    hash_secret: ""
    payment_url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    locale: vn
    expire_minutes: 15

deposit:
  # Mức cọc/phí dự phòng khi BĐS chưa có giá. Bình thường hệ thống tra bảng
  # deposit_policies theo giá BĐS (seed sẵn 5 phân khúc khi khởi động).
  default_amount: 5000000
  default_broker_fee: 200000
  broker_confirm_hours: 24
  otp_valid_minutes: 10
  checkin_grace_hours: 2
  report_window_hours: 24
  dispute_evidence_hours: 48
  payment_timeout_minutes: 30
  cron_interval_seconds: 60

admin:
  # Email được tự động nâng quyền ADMIN khi khởi động (để trống nếu chưa cần)
  email: ""
